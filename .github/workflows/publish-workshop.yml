name: Parakeets Pill Base Workshop

on:
  pull_request:
    paths:
      - 'lua/**'
      - 'materials/**'
      - 'sound/**'
      - 'workshop-preview.png'
      - '.github/workflows/publish-workshop.yml'
  push:
    branches: [main]
    paths:
      - 'lua/**'
      - 'materials/**'
      - 'sound/**'
      - 'workshop-preview.png'
      - '.github/workflows/publish-workshop.yml'
  workflow_dispatch:
    inputs:
      create_new:
        description: Criar um novo item no Workshop (não usar se já existe um item criado)
        type: boolean
        default: false
      workshop_id:
        description: ID de um item existente/draft que deseja publicar ou atualizar
        type: string
        default: ''

permissions:
  contents: read

# A fila é compartilhada entre execuções deste repositório; não coordena os outros repositórios.
concurrency:
  group: workshop-parakeets-pill-base-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: false
  queue: max

jobs:
  workshop:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Conferir arquivos do addon
        shell: bash
        run: |
          set -euo pipefail

          test -d lua
          test -d materials
          test -d sound

          test -n "$(find lua -type f -name '*.lua' -print -quit)"
          test -n "$(find materials -type f -print -quit)"
          test -n "$(find sound -type f -print -quit)"
          test -s workshop-preview.png

          symlinks="$(find . -path './.git' -prune -o -type l -print -quit)"
          if [[ -n "$symlinks" ]]; then
            echo "O repositório contém symlink: $symlinks"
            echo 'Resolva-o antes de publicar.'
            exit 1
          fi

      - name: Instalar Pillow
        run: python -m pip install --quiet pillow

      - name: Preparar preview otimizado
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .workshop
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          src = Path("workshop-preview.png")
          dst = Path(".workshop/workshop-preview.jpg")
          im = Image.open(src).convert("RGB")
          im.thumbnail((512, 512))
          while True:
              for quality in (85, 75, 65, 55, 45):
                  im.save(dst, "JPEG", quality=quality, optimize=True, progressive=True)
                  if dst.stat().st_size <= 450_000:
                      print(f"Preview: {dst.stat().st_size} bytes (quality={quality}, size={im.size})")
                      raise SystemExit(0)
              im = im.resize((max(1, int(im.width * .8)), max(1, int(im.height * .8))), Image.Resampling.LANCZOS)
          PY

      # O repositório também contém arquivos de desenvolvimento e a imagem de
      # preview. Só os diretórios do addon entram no GMA.
      - name: Preparar conteúdo limpo do Workshop
        shell: bash
        run: |
          set -euo pipefail

          package_dir="$GITHUB_WORKSPACE/.workshop/addon"
          rm -rf "$package_dir"
          mkdir -p "$package_dir"

          cp -a lua materials sound "$package_dir/"

          # Remove metadados locais do macOS que não pertencem ao addon.
          find "$package_dir" -type f -name '.DS_Store' -delete

          test -d "$package_dir/lua"
          test -d "$package_dir/materials"
          test -d "$package_dir/sound"

          echo "Arquivos preparados: $(find "$package_dir" -type f | wc -l | tr -d ' ')"

      - name: Validar GMA sem enviar à Steam
        uses: linventif/gmod-workshop-cicd@923dae0a327040b2f01cf6876cbecbbb97462bdf
        with:
          # A action exige os inputs, mas DRY_RUN não inicia sessão Steam.
          steam_user: dry-run
          steam_pass: dry-run
          content_path: .workshop/addon
          preview_file: .workshop/workshop-preview.jpg
          title: Parakeets Pill Base
          description: Base de pills Parakeets modificada para o servidor Sherlock HnS.
          dry_run: 'true'

      - name: Validar destino da publicação
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.WORKSHOP_ID != '')
        env:
          ITEM: ${{ inputs.workshop_id || vars.WORKSHOP_ID }}
          CREATE: ${{ inputs.create_new }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo 'A publicação só pode ser executada a partir da branch main.'
            exit 1
          fi

          if [[ "$CREATE" == "true" ]]; then
            [[ -z "$ITEM" ]] || {
              echo 'WORKSHOP_ID já está configurado; desmarque create_new.'
              exit 1
            }
          else
            [[ "$ITEM" =~ ^[1-9][0-9]*$ ]] || {
              echo 'Configure a variável WORKSHOP_ID ou marque create_new para criar o item.'
              exit 1
            }
          fi

      - name: Conferir acesso da conta Steam
        if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.WORKSHOP_ID != ''))
        env:
          USER_SET: ${{ secrets.STEAM_USER != '' }}
          PASS_SET: ${{ secrets.STEAM_PASS != '' }}
          GUARD_SET: ${{ secrets.STEAM_SHARED_SECRET != '' }}
        shell: bash
        run: |
          set -euo pipefail
          for key in USER_SET PASS_SET GUARD_SET; do
            if [[ "${!key}" != true ]]; then
              echo "::error::Credencial indisponível ($key)"
              exit 1
            fi
          done

      - name: Publicar Parakeets Pill Base
        id: publish
        if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.WORKSHOP_ID != ''))
        uses: linventif/gmod-workshop-cicd@923dae0a327040b2f01cf6876cbecbbb97462bdf
        with:
          steam_user: ${{ secrets.STEAM_USER }}
          steam_pass: ${{ secrets.STEAM_PASS }}
          steam_shared_secret: ${{ secrets.STEAM_SHARED_SECRET }}
          published_file_id: ${{ inputs.create_new && '0' || inputs.workshop_id || vars.WORKSHOP_ID }}
          content_path: .workshop/addon
          preview_file: .workshop/workshop-preview.jpg
          title: Parakeets Pill Base
          description: Base de pills Parakeets modificada para o servidor Sherlock HnS.
          visibility: '0'
          change_note: Atualização do Parakeets Pill Base (${{ github.sha }})

      - name: Registrar resultado da publicação
        if: steps.publish.outcome == 'success'
        env:
          ITEM: ${{ steps.publish.outputs.published_file_id }}
        run: |
          {
            echo "## Parakeets Pill Base publicado"
            echo
            echo "Workshop ID: [$ITEM](https://steamcommunity.com/sharedfiles/filedetails/?id=$ITEM)"
            echo
            echo 'Para as próximas atualizações automáticas, configure a variável de repositório `WORKSHOP_ID` com esse ID, ou informe-o em `workshop_id` ao executar manualmente.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Informar publicação automática desativada
        if: github.event_name == 'push' && vars.WORKSHOP_ID == ''
        run: |
          echo 'Validação concluída. A publicação automática está desativada até configurar a variável WORKSHOP_ID.' >> "$GITHUB_STEP_SUMMARY"
